:root{
  --bg:#07030f;
  --surface:#140a28;
  --surface2:#1d1038;
  --line:#3b2168;
  --ink:#fff7e8;
  --muted:#c9b8e8;
  --teal:#2dd4bf;
  --red:#ef4444;
  --purple:#a855f7;
  --amber:#fbbf24;
  --green:#4ade80;
  --pink:#f472b6;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Rajdhani',system-ui,sans-serif
}

.font-display{
  font-family:'Bungee',system-ui,sans-serif
}

.glass{
  background:linear-gradient(145deg,rgba(29,16,56,.92),rgba(13,6,28,.94));
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 18px 50px rgba(0,0,0,.45)
}

.btn{
  border:0;
  cursor:pointer;
  border-radius:999px;
  font-weight:800;
  letter-spacing:.04em;
  padding:.75rem 1.15rem;
  transition:.18s
}

.btn:active{
  transform:scale(.97)
}

.btn-primary{
  background:linear-gradient(90deg,#ef4444,#a855f7,#2dd4bf);
  color:white;
  box-shadow:0 8px 28px rgba(168,85,247,.45)
}

.btn-ghost{
  background:rgba(255,255,255,.08);
  color:var(--ink);
  border:1px solid #4c2f83
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none
}

.chip{
  border:1px solid #4c2f83;
  background:rgba(255,255,255,.06);
  border-radius:999px;
  padding:.35rem .7rem;
  font-weight:700;
  font-size:.85rem
}

.opt{
  width:100%;
  text-align:left;
  border:1px solid #4c2f83;
  background:rgba(255,255,255,.05);
  color:var(--ink);
  border-radius:14px;
  padding:.75rem .9rem;
  font-weight:700;
  cursor:pointer
}

.opt:hover{
  border-color:var(--teal)
}

.opt.correct{
  background:rgba(74,222,128,.18);
  border-color:var(--green)
}

.opt.wrong{
  background:rgba(239,68,68,.18);
  border-color:var(--red)
}

.particle{
  position:absolute;
  border-radius:999px;
  pointer-events:none;
  animation:float 7s ease-in-out infinite
}

@keyframes float{
  0%,100%{
    transform:translateY(0);
    opacity:.45
  }

  50%{
    transform:translateY(-18px);
    opacity:1
  }
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}

@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 30px rgba(168,85,247,.55)
  }

  50%{
    box-shadow:0 0 70px rgba(45,212,191,.75)
  }
}

.portal-disc{
  animation:pulseGlow 1.1s ease-in-out infinite, spinSlow 5s linear infinite
}

@keyframes suckCenter{
  to{
    transform:scale(.02) rotate(14deg);
    filter:blur(10px) brightness(2);
    opacity:0
  }
}

@keyframes suckUp{
  to{
    transform:translateY(-55vh) scale(.02) rotate(10deg);
    filter:blur(10px) brightness(2);
    opacity:0
  }
}

@keyframes suckDown{
  to{
    transform:translateY(55vh) scale(.02) rotate(-10deg);
    filter:blur(10px) brightness(2);
    opacity:0
  }
}

@keyframes fallDown{
  to{
    transform:translateY(42vh) scale(.08) rotate(24deg);
    filter:blur(8px);
    opacity:0
  }
}

@keyframes burstIn{
  0%{
    transform:scale(.02) rotate(-8deg);
    filter:blur(12px);
    opacity:0
  }

  70%{
    transform:scale(1.04) rotate(1deg);
    filter:blur(0);
    opacity:1
  }

  100%{
    transform:scale(1)
  }
}

@keyframes burstBig{
  0%{
    transform:scale(.02);
    filter:blur(14px);
    opacity:0
  }

  60%{
    transform:scale(1.08);
    opacity:1
  }

  100%{
    transform:scale(1)
  }
}

.suck-center{
  animation:suckCenter .9s ease-in forwards
}

.suck-up{
  animation:suckUp .9s ease-in forwards
}

.suck-down{
  animation:suckDown .9s ease-in forwards
}

.fall{
  animation:fallDown .9s ease-in forwards
}

.burst{
  animation:burstIn .7s cubic-bezier(.2,.9,.3,1.2) both
}

.burst-big{
  animation:burstBig .85s cubic-bezier(.2,.9,.3,1.2) both
}

@keyframes rise{
  from{
    transform:translateY(0);
    opacity:1
  }

  to{
    transform:translateY(-90px);
    opacity:0
  }
}

.bubble{
  animation:rise 1.4s ease-out forwards
}

@keyframes wiggle{
  0%,100%{
    transform:rotate(-2deg)
  }

  50%{
    transform:rotate(2deg)
  }
}

.wiggle{
  animation:wiggle 1.2s ease-in-out infinite
}

@media (prefers-reduced-motion: reduce){
  .particle,.portal-disc,.wiggle{
    animation:none!important
  }

  .suck-center,.suck-up,.suck-down,.fall,.burst,.burst-big{
    animation-duration:.01s!important
  }
}

input[type=range]{
  accent-color:#2dd4bf;
  width:100%
}

@media (min-width: 640px){
  .sm\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:p-10{
    padding: 2.5rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:text-2xl{
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-4xl{
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-lg{
    font-size: 1.125rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 1024px){
  .lg\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.2fr_\.8fr\]{
    grid-template-columns: 1.2fr .8fr;
  }
}
