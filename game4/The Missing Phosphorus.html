:root{
  --bg:#07030d;
  --surface:#14091d;
  --surface2:#1e0f2a;
  --line:#ff2a2a;
  --red:#ff2020;
  --red2:#ff6b35;
  --cyan:#38e8ff;
  --amber:#ffc83d;
  --paper:#f7e8d5;
  --muted:#b9a9c7;
  --green:#5eff8a;
  --ink:#fff8ec;
}
*{
  box-sizing:border-box
}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Rajdhani',system-ui,sans-serif
}
button{
  font-family:inherit
}
.font-horror{
  font-family:'Creepster',cursive;

}
.font-type{
  font-family:'Special Elite',monospace
}
.no-scrollbar::-webkit-scrollbar{
  display:none
}
@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }
  50%{
    transform:translateY(-10px)
  }
}
@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 18px #ff2020,0 0 45px #ff202044
  }
  50%{
    box-shadow:0 0 32px #ff2020,0 0 80px #ff202077
  }
}
@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}
@keyframes spinRev{
  to{
    transform:rotate(-360deg)
  }
}
@keyframes fog{
  0%{
    transform:translateX(-8%)
  }
  50%{
    transform:translateX(7%)
  }
  100%{
    transform:translateX(-8%)
  }
}
@keyframes shake{
  0%,100%{
    transform:translateX(0)
  }
  25%{
    transform:translateX(-8px)
  }
  75%{
    transform:translateX(8px)
  }
}
@keyframes flicker{
  0%,100%{
    opacity:1
  }
  92%{
    opacity:1
  }
  93%{
    opacity:.3
  }
  94%{
    opacity:1
  }
  97%{
    opacity:.55
  }
  98%{
    opacity:1
  }
}
@keyframes rise{
  from{
    opacity:0;
    transform:translateY(18px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}
@keyframes orbPulse{
  0%,100%{
    transform:scale(1);
    filter:brightness(1)
  }
  50%{
    transform:scale(1.25);
    filter:brightness(1.6)
  }
}
@keyframes lightning{
  0%,88%,100%{
    opacity:0
  }
  90%,94%{
    opacity:.9
  }
  92%{
    opacity:.2
  }
}
@keyframes tentacle{
  0%,100%{
    transform:rotate(-3deg)
  }
  50%{
    transform:rotate(4deg)
  }
}
@keyframes sparkle{
  0%{
    transform:scale(.2) rotate(0);
    opacity:1
  }
  100%{
    transform:scale(1.8) rotate(90deg);
    opacity:0
  }
}
@keyframes marquee{
  from{
    transform:translateX(0)
  }
  to{
    transform:translateX(-50%)
  }
}
@keyframes vortexSpin{
  to{
    transform:rotate(360deg) scale(1.04)
  }
}
@keyframes vortexSpinRev{
  to{
    transform:rotate(-360deg) scale(.97)
  }
}
@keyframes suckIn{
  0%{
    transform:translate(0,0) scale(1);
    opacity:0
  }
  12%{
    opacity:1
  }
  82%{
    opacity:1
  }
  100%{
    transform:translate(var(--tx),var(--ty)) scale(.08);

  }
}
@keyframes crackSpread{
  0%{
    transform:scale(.08);
    opacity:0
  }
  28%{
    opacity:1
  }
  70%{
    transform:scale(1);
    opacity:1
  }
  100%{

  }
}

  }
  100%{

    filter:brightness(1)
  }
}
@keyframes portalBreathe{

}

  50%{
    transform:translateX(14%) scaleY(1.18);
    opacity:.85
  }
  100%{
    transform:translateX(-18%) scaleY(1);
    opacity:.55
  }
}
@keyframes vineCreep{

  50%{
    transform:rotate(5deg) scaleY(1.06)
  }
}
@keyframes lightningFlicker{

    opacity:1

    opacity:.15

  90%{
    opacity:.75

  }
}

  }
}
@keyframes whiteFlash{
  0%{
    opacity:0
  }
  18%{

  }
  55%{
    opacity:.92
  }
  100%{
    opacity:0
  }
}

  from{

  }

  }
}

  }
  55%{
    transform:scale(.92) rotate(-8deg);
    opacity:1
  }
  75%{

  }
  100%{

  }
}

  }
}

  }
