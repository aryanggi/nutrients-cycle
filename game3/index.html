  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }
  50%{
    transform:translateY(-14px) rotate(2deg)
  }
}
@keyframes drift{
  0%{
    transform:translateY(0) translateX(0);
    opacity:0
  }
  10%{
    opacity:.9
  }
  90%{
    opacity:.7
  }
  100%{
    transform:translateY(-92vh) translateX(24px);
    opacity:0
  }
}

  0%,100%{
    opacity:1
  }
  92%{
    opacity:1
  }
  93%{
    opacity:.55
  }
  94%{
    opacity:1
  }
  97%{
    opacity:.7
  }
  98%{
    opacity:1
  }
}

  0%,100%{
    box-shadow:0 0 0 0 rgba(255,42,42,.55)
  }
  50%{
    box-shadow:0 0 28px 4px rgba(255,42,42,.45)
  }
}

  0%{
    transform:translateY(0) scale(.8);
    opacity:0
  }
  15%{
    opacity:1
  }
  100%{
    transform:translateY(-280px) scale(1.25);
    opacity:0
  }
}

  0%{
    transform:translateY(0) translateX(0)
  }
  100%{
    transform:translateY(-100vh) translateX(60px)
  }
}
@keyframes growPlant{
  0%{
    transform:scaleY(.15)
  }
  100%{
    transform:scaleY(1)
  }
}
@keyframes shake{
  0%,100%{
    transform:translateX(0)
  }
  25%{
    transform:translateX(-5px)
  }
  75%{
    transform:translateX(5px)
  }
}
@keyframes gateClose{
  0%{
    transform:translateX(0)
  }
  100%{
    transform:translateX(-42%)
  }
}
@keyframes vine{
  0%{
    transform:rotate(-3deg)
  }
  100%{
    transform:rotate(3deg)
  }
}
@keyframes popIn{
  0%{
    transform:scale(.86);
    opacity:0
  }
  100%{
    transform:scale(1);
    opacity:1
  }
}
